<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostPilot - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        (function () {
            try {
                if (localStorage.getItem('postpilot_theme_v2') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-app);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            padding: 1.25rem;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow,
        .ambient-glow-2 {
            display: none;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2.15rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 1.85rem;
        }

        .brand-icon-wrapper {
            width: 52px;
            height: 52px;
            margin: 0 auto 1rem;
            background: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.45rem;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-name {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 0.35rem;
        }

        .brand-tagline {
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
        }

        .brand-gaatha-pill {
            color: var(--accent-gold);
            font-weight: 700;
        }

        .channel-pill-row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-top: 0.9rem;
        }

        .channel-mini-pill {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: var(--bg-surface-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .alert-box {
            display: none;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            background: var(--danger-light);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            font-size: 0.85rem;
            margin-bottom: 1.35rem;
            align-items: center;
            gap: 0.6rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.45rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 0.95rem;
            color: var(--text-muted);
            font-size: 0.92rem;
            pointer-events: none;
        }

        .login-input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.65rem;
            background: var(--bg-input);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.94rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .toggle-password-btn {
            position: absolute;
            right: 0.75rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.35rem 0.5rem;
            font-size: 0.95rem;
            transition: color 0.15s;
        }

        .toggle-password-btn:hover {
            color: var(--text-primary);
        }

        .submit-btn {
            width: 100%;
            padding: 0.85rem 1.25rem;
            margin-top: 1.35rem;
            background: var(--primary);
            border: 1px solid transparent;
            border-radius: 10px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
            min-height: 46px;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            box-shadow: var(--shadow-md);
        }

        .submit-btn:active {
            background: var(--primary-active);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .login-footer {
            margin-top: 1.85rem;
            padding-top: 1.15rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .login-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.85rem 1.35rem;
                border-radius: 14px;
            }

            .brand-name {
                font-size: 1.45rem;
            }
        }
    </style>
</head>

<body>
    <main class="login-card" role="main">
        <header class="brand-header">
            <div class="brand-icon-wrapper" aria-hidden="true">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h1 class="brand-name">PostPilot</h1>
            <p class="brand-tagline" style="display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
                <span class="brand-gaatha-pill">BY GAATHA</span> &middot; <span style="color: var(--primary);">Operations Workspace</span>
            </p>
            <div class="channel-pill-row">
                <span class="channel-mini-pill"><i class="fa-brands fa-meta" style="color: var(--fb-blue);"></i> Meta</span>
                <span class="channel-mini-pill"><i class="fa-brands fa-instagram" style="color: var(--ig-pink);"></i> Instagram</span>
                <span class="channel-mini-pill"><i class="fa-brands fa-linkedin" style="color: var(--li-blue);"></i> LinkedIn</span>
                <span class="channel-mini-pill"><i class="fa-brands fa-whatsapp" style="color: var(--wa-green);"></i> WhatsApp</span>
            </div>
        </header>

        <div id="login-alert" class="alert-box" role="alert" aria-live="polite">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="alert-text">Authentication failed</span>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" novalidate>
            <input type="hidden" id="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon" aria-hidden="true"></i>
                    <input type="text" id="username" class="login-input" placeholder="Enter your username" required
                        autofocus autocomplete="username" spellcheck="false">
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                    <input type="password" id="password" class="login-input" placeholder="Enter password" required
                        autocomplete="current-password">
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()"
                        title="Show or hide password" aria-label="Toggle password visibility">
                        <i id="password-toggle-icon" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-btn" class="submit-btn">
                <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
                <span>Sign In to PostPilot</span>
            </button>
        </form>

        <!-- Public Footer with Legal & Information Links -->
        <footer class="login-footer">
            <div style="display: flex; justify-content: center; gap: 0.85rem; margin-bottom: 0.65rem; flex-wrap: wrap; font-size: 0.82rem;">
                <a href="/about">About Us</a>
                <span>&middot;</span>
                <a href="/privacy">Privacy Policy</a>
                <span>&middot;</span>
                <a href="/terms">Terms &amp; Conditions</a>
                <span>&middot;</span>
                <a href="/agreement">User Agreement</a>
            </div>
            <span>PostPilot — BY GAATHA &middot; Mobile &amp; Desktop Ready</span>
        </footer>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('login-alert');
            const alertText = document.getElementById('alert-text');
            const submitBtn = document.getElementById('login-btn');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const csrfToken = document.getElementById('csrf_token').value;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                alertText.textContent = 'Please enter both username and password';
                alertBox.style.display = 'flex';
                return;
            }

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Signing in...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    submitBtn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Success! Redirecting...</span>';
                    submitBtn.style.background = '#059669';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 250);
                } else {
                    alertText.textContent = data.error || 'Invalid credentials. Please try again.';
                    alertBox.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> <span>Sign In to PostPilot</span>';
                }
            } catch (err) {
                alertText.textContent = 'Network or server error. Please verify connection.';
                alertBox.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> <span>Sign In to PostPilot</span>';
            }
        }
    </script>
</body>

</html>
